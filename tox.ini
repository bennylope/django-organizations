[tox]
minversion = 4.22
envlist =
    py{310,311,312,313,314}-django52
    py{312,313,314}-django{60}

[testenv]
package = wheel
setenv =
    PYTHONPATH = {toxinidir}
commands = pytest {posargs}
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
deps =
    django52: Django>=5.2.8,<6  # Django 5.2.8 is required for Python 3.14 support
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
dependency_groups = tests
